plugins {
    id 'java-library'
    id 'maven-publish'
}

group 'ch.interlis'
version '1.0.0'+System.getProperty('release','-SNAPSHOT')

configurations {
    ftpAntTask
}

repositories {
	mavenLocal()
    mavenCentral()
    maven {
        url "https://jars.interlis.ch"
    }
}

// to get the latest SNAPSHOT uncomment the following lines
//configurations.all {
    // check for updates every build
    //resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
//}

Properties properties = new Properties()
File propFile=project.rootProject.file('user.properties')
if(propFile.exists()){
	properties.load(propFile.newDataInputStream())
}
def git = System.getProperty('git',properties.get('git','git'))
def repos_url = System.getProperty('repos_url',properties.get('repos_url','repos_url'))
def repos_pwd = System.getProperty('repos_pwd',properties.get('repos_pwd','repos_pwd'))
def repos_usr = System.getProperty('repos_usr',properties.get('repos_usr','repos_usr'))
def downloads_pwd = System.getProperty('downloads_pwd',properties.get('downloads_pwd','downloads_pwd'))
def downloads_usr = System.getProperty('downloads_usr',properties.get('downloads_usr','downloads_usr'))

def generatedResources = "$buildDir/generated-resources/main"

def getGitHash = { ->
    def stdout = new ByteArrayOutputStream()
    exec {
        commandLine git, 'rev-parse', 'HEAD'
        standardOutput = stdout
    }
    return stdout.toString().trim()
}

dependencies {
    // Use JUnit test framework.
    testImplementation libs.junit

    // This dependency is exported to consumers, that is to say found on their compile classpath.
    //api libs.commons.math3

    // This dependency is used internally, and not exposed to consumers on their own compile classpath.
    implementation 'ch.ehi:ehibasics:1.4.1'
    implementation 'ch.interlis:iox-api:1.0.4'
    implementation 'ch.interlis:iox-ili:1.24.3+'
    implementation 'ch.interlis:ili2c-core:5.6.7+'
    implementation 'ch.interlis:ili2c-tool:5.6.7+'
	implementation 'org.xerial:sqlite-jdbc:3.43.0.0'
	
    ftpAntTask "org.apache.ant:ant-commons-net:1.10.15" // muss zu gradle builtin ant version passen!
	
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
    options.encoding = 'US-ASCII'
}

sourceSets {
    main {
    	output.dir(generatedResources, builtBy: 'generateMyResources')
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs =[ 'src/main/resources','src/main/ili']
            include 'META-INF/native-image/**'
            include "**/*.properties"
            include "**/*.ili"
            exclude "**/Version.properties"
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
        resources {
            srcDirs = ['src/test/ili']
        }
    }
}

task generateMyResources {
	def versionPropsFile = new File(generatedResources,"org/interlis2/ilivalid_gwr/Version.properties")
	def version="$project.version"
	def hash=getGitHash()
	inputs.property("version","$project.version")
	inputs.property("hash",getGitHash())
	outputs.file versionPropsFile
	doLast {
		def versionProps = new Properties()
		versionProps.setProperty('version', version)
		versionProps.setProperty('versionCommit', hash)
		versionPropsFile.getParentFile().mkdirs();
		versionProps.store(versionPropsFile.newWriter(), null);
	}
}

task bindist(type: Zip){
	archiveBaseName = project.name
	destinationDirectory = file('dist')
	from jar
	into('docs'){
		from files("LICENSE","docs/CHANGELOG.txt","src/test/ili/IliValidGwr_V1_0.ili")
	}
	into('libs'){
		from configurations.runtimeClasspath
		//def jars=[]
		//subprojects.each {
        //	jars+=it.libsDir
        //}
        //from jars
	}
	// version = '1.0.6'
}

jar {
  manifest {
    attributes(
      "iox-class-path": "sqlite-jdbc-3.43.0.0.jar"
    )
  }
}

test {
    testLogging.exceptionFormat = 'full'
}

publishing {
	publications {
        maven(MavenPublication) {
            artifact jar
        }
        maven(MavenPublication) {
            artifact(bindist){
            	extension 'zip'
            	classifier 'bindist'
            }
        }
    }
    repositories {
        maven {
            url = repos_url
            credentials {
            	username = repos_usr
            	password = repos_pwd
            }            
        }
    }
}

task uploadBin(dependsOn: bindist) {
	doLast {
		ant.taskdef(name: 'ftp',
					classname: 'org.apache.tools.ant.taskdefs.optional.net.FTP',
					classpath: configurations.ftpAntTask.asPath)
		def dist= bindist.archiveFile.get().asFile.parent
		def name=bindist.archiveFile.get().asFile.name
		def json = groovy.json.JsonOutput.toJson([filename: 'https://downloads.interlis.ch/ilivalid-gwr/'+name, version: project.version ,date: new Date().format( 'yyyy-MM-dd' )])
		def releaseFile = new File(dist,project.name+"-release.json")
		releaseFile.write(json)
		ant.ftp(server: "jql.ftp.infomaniak.com", userid: downloads_usr, password: downloads_pwd, 
			remoteDir: "/ilivalid-gwr", passive:"yes") {
				fileset(dir: dist ) {
					include(name: name)
					include(name: releaseFile.name)
				}
		}
	}
}
